name: Verify portfolio

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Verify public agent endpoints
        shell: bash
        run: |
          set -euo pipefail

          npm run start -- -p 3000 > /tmp/aedwon-next.log 2>&1 &
          SERVER_PID=$!
          trap 'STATUS=$?; kill "$SERVER_PID" 2>/dev/null || true; if [ "$STATUS" -ne 0 ]; then echo "--- next server log ---"; cat /tmp/aedwon-next.log; fi; exit "$STATUS"' EXIT

          READY=0
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = "1"

          assert_status() {
            local path="$1"
            local expected="$2"
            local actual
            actual=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000${path}")
            if [ "$actual" != "$expected" ]; then
              echo "Expected ${path} to return ${expected}, got ${actual}"
              return 1
            fi
          }

          assert_status "/path-that-does-not-exist" "404"
          assert_status "/llms.txt" "200"
          assert_status "/sitemap.xml" "200"
          assert_status "/robots.txt" "200"
          assert_status "/about" "200"
          assert_status "/contact" "200"
          assert_status "/privacy" "200"
          assert_status "/opengraph-image" "200"

          LLMS_BODY=$(curl -fsS http://127.0.0.1:3000/llms.txt)
          grep -Fq "When to use this site" <<< "$LLMS_BODY"

          SITEMAP_BODY=$(curl -fsS http://127.0.0.1:3000/sitemap.xml)
          grep -Fq "<lastmod>" <<< "$SITEMAP_BODY"

          ROBOTS_BODY=$(curl -fsS http://127.0.0.1:3000/robots.txt)
          grep -Fq "Sitemap: https://aedwon.com/sitemap.xml" <<< "$ROBOTS_BODY"

          MARKDOWN_HEADERS=$(curl -sSI -H "Accept: text/markdown" http://127.0.0.1:3000/projects | tr -d '\r')
          grep -Eqi '^content-type: text/markdown; charset=utf-8$' <<< "$MARKDOWN_HEADERS"
          grep -Eqi '^vary: .*accept' <<< "$MARKDOWN_HEADERS"

          MARKDOWN_BODY=$(curl -fsS -H "Accept: text/markdown" http://127.0.0.1:3000/projects)
          grep -Fq "# Projects" <<< "$MARKDOWN_BODY"

          HTML_HEADERS=$(curl -sSI -H "Accept: text/html" http://127.0.0.1:3000/ | tr -d '\r')
          grep -Eqi '^vary: .*accept' <<< "$HTML_HEADERS"

          UNSUPPORTED_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -H "Accept: application/pdf" http://127.0.0.1:3000/)
          test "$UNSUPPORTED_STATUS" = "406"

          MARKDOWN_404_STATUS=$(curl -sS -o /tmp/markdown-404.txt -w "%{http_code}" -H "Accept: text/markdown" http://127.0.0.1:3000/path-that-does-not-exist)
          test "$MARKDOWN_404_STATUS" = "404"
          grep -Fq "llms.txt" /tmp/markdown-404.txt
          grep -Fq "sitemap.xml" /tmp/markdown-404.txt

          HOME_HTML=$(curl -fsS -H "Accept: text/html" http://127.0.0.1:3000/)
          grep -Eqi '<h1' <<< "$HOME_HTML"
          grep -Fq 'rel="canonical"' <<< "$HOME_HTML"
          grep -Fq 'property="og:type"' <<< "$HOME_HTML"
          grep -Fq '"@type":"Person"' <<< "$HOME_HTML"

          OG_HEADERS=$(curl -sSI http://127.0.0.1:3000/opengraph-image | tr -d '\r')
          grep -Eqi '^content-type: image/png' <<< "$OG_HEADERS"
