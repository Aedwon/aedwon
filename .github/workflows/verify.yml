name: Verify portfolio

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Verify public agent endpoints
        shell: bash
        run: |
          set -euo pipefail

          npm run start -- -p 3000 > /tmp/aedwon-next.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/aedwon-next.log
            exit 1
          fi

          assert_status() {
            local path="$1"
            local expected="$2"
            local actual
            actual=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000${path}")
            test "$actual" = "$expected"
          }

          assert_status "/path-that-does-not-exist" "404"
          assert_status "/llms.txt" "200"
          assert_status "/sitemap.xml" "200"
          assert_status "/robots.txt" "200"
          assert_status "/about" "200"
          assert_status "/contact" "200"
          assert_status "/privacy" "200"
          assert_status "/opengraph-image" "200"

          curl -fsS http://127.0.0.1:3000/llms.txt | grep -q "When to use this site"
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q "<lastmod>"
          curl -fsS http://127.0.0.1:3000/robots.txt | grep -q "Sitemap: https://aedwon.com/sitemap.xml"

          MARKDOWN_HEADERS=$(curl -sSI -H "Accept: text/markdown" http://127.0.0.1:3000/projects | tr -d '\r')
          echo "$MARKDOWN_HEADERS" | grep -qi '^content-type: text/markdown; charset=utf-8$'
          echo "$MARKDOWN_HEADERS" | grep -qi '^vary: .*accept'

          HTML_HEADERS=$(curl -sSI -H "Accept: text/html" http://127.0.0.1:3000/ | tr -d '\r')
          echo "$HTML_HEADERS" | grep -qi '^vary: .*accept'

          UNSUPPORTED_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -H "Accept: application/pdf" http://127.0.0.1:3000/)
          test "$UNSUPPORTED_STATUS" = "406"

          MARKDOWN_404_STATUS=$(curl -sS -o /tmp/markdown-404.txt -w "%{http_code}" -H "Accept: text/markdown" http://127.0.0.1:3000/path-that-does-not-exist)
          test "$MARKDOWN_404_STATUS" = "404"
          grep -q "llms.txt" /tmp/markdown-404.txt
          grep -q "sitemap.xml" /tmp/markdown-404.txt

          HOME_HTML=$(curl -fsS -H "Accept: text/html" http://127.0.0.1:3000/)
          echo "$HOME_HTML" | grep -qi '<h1'
          echo "$HOME_HTML" | grep -q 'rel="canonical"'
          echo "$HOME_HTML" | grep -q 'property="og:type"'
          echo "$HOME_HTML" | grep -q '"@type":"Person"'

          OG_HEADERS=$(curl -sSI http://127.0.0.1:3000/opengraph-image | tr -d '\r')
          echo "$OG_HEADERS" | grep -qi '^content-type: image/png'
