<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>(light) About — volumes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mono{font-family:'Geist Mono',monospace}
.nlink{color:#56565E;text-decoration:none;transition:color .2s ease}
.nlink:hover{color:#111114}
.ctl{transition:scale .3s cubic-bezier(.34,1.56,.64,1),background-color .2s ease,opacity .2s ease}
.ctl:hover{background-color:#E9E7E2}
.ctl:active{scale:.94}
a:focus-visible,button:focus-visible{outline:2px solid #111114;outline-offset:3px}
.face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-sizing:border-box}
.shade{position:absolute;inset:0;background:#000;pointer-events:none}
.edge{background-color:#E4E2DB;background-image:repeating-linear-gradient(to bottom,#E4E2DB 0px,#E4E2DB 2px,#cfcdc5 2px,#cfcdc5 3px)}
.edgeV{background-color:#E4E2DB;background-image:repeating-linear-gradient(to right,#E4E2DB 0px,#E4E2DB 2px,#cfcdc5 2px,#cfcdc5 3px)}
.hit{position:absolute;padding:0;border:none;background:transparent;cursor:pointer}
.hit:focus-visible{outline:2px solid #111114;outline-offset:4px}
.pagehit{cursor:pointer}
</style>
</helmet>
<div data-bk="{{ uid }}" onMouseMove="{{ lean }}" onMouseLeave="{{ unlean }}" style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: {{ rootBg }}; color: #111114; font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; perspective: 2600px; perspective-origin: 50% 46%">

<!-- the room: a shelf, a small stack, a bookend -->
<div aria-hidden="true" style="position: absolute; inset: 0; opacity: {{ room.op }}; translate: 0 {{ room.y }}">
<div style="position: absolute; left: 300px; width: 840px; top: 780px; height: 2px; background: #FFFFFF"></div>
<div style="position: absolute; left: 300px; width: 840px; top: 782px; height: 16px; background: #E1DFD8; box-shadow: 0 10px 22px -10px rgba(17,17,20,.25)"></div>
<div style="position: absolute; left: 310px; width: 820px; top: 798px; height: 26px; background: linear-gradient(rgba(17,17,20,.07), rgba(17,17,20,0))"></div>
<div style="position: absolute; left: 340px; top: 744px; width: 150px; height: 36px; border-radius: 3px; background: #DAD8D1; border-top: 1px solid #E8E6E0"></div>
<div style="position: absolute; left: 350px; top: 712px; width: 134px; height: 32px; border-radius: 3px; background: #26262B; border-top: 1px solid #3a3a40"></div>
<div style="position: absolute; left: 346px; top: 686px; width: 142px; height: 26px; border-radius: 3px; background: #FBFAF7; border-top: 1px solid #FFFFFF; box-shadow: inset 0 -1px 0 #E3E1DB"></div>
<div style="position: absolute; left: 1004px; top: 600px; width: 14px; height: 180px; background: #2A2A30; border-left: 1px solid #3a3a42"></div>
<div style="position: absolute; left: 1004px; top: 766px; width: 64px; height: 14px; background: #2A2A30"></div>
<span class="mono" style="position: absolute; right: 300px; top: 846px; font-size: 12px; color: #6A6A72">Manila · {{ clock }}</span>
</div>

<!-- the books, all in one 3D space -->
<div style="position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none">
<sc-for list="{{ books }}" as="b" hint-placeholder-count="6">
<div style="position: absolute; left: 0; top: 0; width: 420px; height: 600px; transform-style: preserve-3d; transform: {{ b.tf }}; opacity: {{ b.op }}">

<div class="face" style="left: 0; top: 0; width: 420px; height: 600px; transform: rotateY(180deg) translateZ({{ b.hd }}); visibility: {{ b.solid }}; background: {{ b.tone }}; border-radius: 3px 6px 6px 3px"><span class="shade" style="opacity: {{ b.sh.back }}"></span></div>

<div class="face" style="left: {{ b.spL }}; top: 0; width: {{ b.dpx }}; height: 600px; transform: rotateY(-90deg) translateZ(210px); visibility: {{ b.solid }}; background: {{ b.tone }}; color: {{ b.ink }}; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 22px 0 20px; overflow: hidden">
<span style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span class="mono" style="font-size: 11px; letter-spacing: 0.14em; opacity: .7">VOL.</span><span style="font-size: 30px; font-weight: 800; letter-spacing: -0.04em">{{ b.n }}</span></span>
<span style="width: 64%; height: 1px; background: currentColor; opacity: .28"></span>
<span style="writing-mode: vertical-rl; font-size: {{ b.fs }}; font-weight: 800; letter-spacing: 0.03em; white-space: nowrap; max-height: 360px; overflow: hidden; text-overflow: ellipsis">{{ b.title }}</span>
<span style="width: 64%; height: 1px; background: currentColor; opacity: .28"></span>
<span class="mono" style="writing-mode: vertical-rl; font-size: 10.5px; letter-spacing: 0.22em; opacity: .7">AEDWON</span>
<span class="shade" style="opacity: {{ b.sh.spine }}"></span>
</div>

<div class="face edge" style="left: {{ b.spL }}; top: 5px; width: {{ b.dpx }}; height: 590px; transform: rotateY(90deg) translateZ(206px)"><span class="shade" style="opacity: {{ b.sh.fore }}"></span></div>
<div class="face edgeV" style="left: 4px; top: {{ b.tbT }}; width: 412px; height: {{ b.dpx }}; transform: rotateX(90deg) translateZ(297px)"><span class="shade" style="opacity: {{ b.sh.top }}"></span></div>
<div class="face edgeV" style="left: 4px; top: {{ b.tbT }}; width: 412px; height: {{ b.dpx }}; transform: rotateX(-90deg) translateZ(297px)"><span class="shade" style="opacity: {{ b.sh.bottom }}"></span></div>

<!-- the front: pages, cover on its hinge, and a turning leaf -->
<div style="position: absolute; inset: 0; transform: translateZ({{ b.hd }}); transform-style: preserve-3d">
<sc-if value="{{ b.active }}" hint-placeholder-val="{{ false }}">
<div class="pagehit" onClick="{{ fwd }}" style="position: absolute; left: 0; top: 0; width: 420px; height: 600px; transform-origin: 0 50%; transform: translateZ(-3px) scale(0.982); pointer-events: {{ rd.pe }}">
<dc-import name="BookPage" form="{{ form }}" on-field="{{ setField }}" on-shelve="{{ shelve }}" page="{{ rd.R }}" side="right" on-go="{{ goPage }}" on-next-vol="{{ nextVol }}" clock="{{ clock }}" hint-size="420px,600px"></dc-import>
<span class="shade" style="opacity: {{ rd.Rsh }}"></span>
<span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 0; width: {{ rd.castW }}; background: linear-gradient(to right, rgba(0,0,0,.32), rgba(0,0,0,0)); opacity: {{ rd.castOp }}; visibility: {{ rd.castVis }}; pointer-events: none"></span>
</div>
</sc-if>
<div style="position: absolute; inset: 0; transform-origin: 0 50%; transform: rotateY({{ b.cover }}); transform-style: preserve-3d">
<div class="face" style="inset: 0; background: {{ b.tone }}; color: {{ b.ink }}; border-radius: 3px 6px 6px 3px; padding: 44px 40px; display: flex; flex-direction: column; overflow: hidden">
<span aria-hidden="true" style="position: absolute; left: 14px; top: 0; bottom: 0; width: 1px; background: currentColor; opacity: .14"></span>
<span class="mono" style="font-size: 12px; letter-spacing: 0.22em; opacity: .7">AEDWON</span>
<span style="margin-top: auto; font-size: 150px; font-weight: 800; letter-spacing: -0.075em; line-height: .86">{{ b.n }}</span>
<span style="font-size: {{ b.cfs }}; font-weight: 800; letter-spacing: -0.045em; line-height: 1.02; overflow-wrap: anywhere">{{ b.title }}</span>
<span class="shade" style="opacity: {{ b.sh.front }}"></span>
</div>
<div class="face pagehit" onClick="{{ backPage }}" style="inset: 0; transform: rotateY(180deg); pointer-events: {{ rd.pe }}; background: #ECEBE6; border-radius: 6px 3px 3px 6px; overflow: hidden">
<sc-if value="{{ b.active }}" hint-placeholder-val="{{ false }}"><dc-import name="BookPage" form="{{ form }}" on-field="{{ setField }}" on-shelve="{{ shelve }}" page="{{ rd.L }}" side="left" on-go="{{ goPage }}" on-next-vol="{{ nextVol }}" clock="{{ clock }}" hint-size="420px,600px"></dc-import></sc-if>
<span class="shade" style="opacity: {{ b.sh.inside }}"></span>
</div>
</div>
<sc-if value="{{ b.leafOn }}" hint-placeholder-val="{{ false }}">
<!-- the turning leaf, in six hinged strips so the paper bends as it turns; kept mounted so a turn starts instantly -->
<div style="position: absolute; left: 0; top: 0; width: 420px; height: 600px; transform-origin: 0 50%; transform: {{ rd.ls }}; transform-style: preserve-3d; pointer-events: none; visibility: {{ rd.vis }}">
<div style="position: absolute; left: 0px; top: 0; width: 70px; height: 600px; transform-origin: 0 50%; transform: {{ rd.t1 }}; transform-style: preserve-3d">
<div class="face" style="inset: 0; overflow: hidden; opacity: {{ rd.fo }}"><div style="position: absolute; left: 0px; top: 0; width: 420px; height: 600px"><dc-import name="BookPage" form="{{ form }}" on-field="{{ setField }}" on-shelve="{{ shelve }}" page="{{ rd.A }}" side="right" clock="{{ clock }}" hint-size="420px,600px"></dc-import></div><span class="shade" style="opacity: {{ rd.s1a }}"></span></div>
<div class="face" style="inset: 0; transform: rotateY(180deg); overflow: hidden; opacity: {{ rd.fo }}"><div style="position: absolute; left: -350px; top: 0; width: 420px; height: 600px"><dc-import name="BookPage" form="{{ form }}" on-field="{{ setField }}" on-shelve="{{ shelve }}" page="{{ rd.B }}" side="left" clock="{{ clock }}" hint-size="420px,600px"></dc-import></div><span class="shade" style="opacity: {{ rd.s1b }}"></span></div>
<div style="position: absolute; left: 70px; top: 0; width: 70px; height: 600px; transform-origin: 0 50%; transform: {{ rd.t2 }}; transform-style: preserve-3d">
<div class="face" style="inset: 0; overflow: hidden; opacity: {{ rd.fo }}"><div style="position: absolute; left: -70px; top: 0; width: 420px; height: 600px"><dc-import name="BookPage" form="{{ form }}" on-field="{{ setField }}" on-shelve="{{ shelve }}" page="{{ rd.A }}" side="right" clock="{{ clock }}" hint-size="420px,600px"></dc-import></div><span class="shade" style="opacity: {{ rd.s2a }}"></span></div>
<div class="face" style="inset: 0; transform: rotateY(180deg); overflow: hidden; opacity: {{ rd.fo }}"><div style="position: absolute; left: -280px; top: 0; width: 420px; height: 600px"><dc-import name="BookPage" form="{{ form }}" on-field="{{ setField }}" on-shelve="{{ shelve }}" page="{{ rd.B }}" side="left" clock="{{ clock }}" hint-size="420px,600px"></dc-import></div><span class="shade" style="opacity: {{ rd.s2b }}"></span></div>
<div style="position: absolute; left: 70px; top: 0; width: 70px; height: 600px; transform-origin: 0 50%; transform: {{ rd.t3 }}; transform-style: preserve-3d">
<div class="face" style="inset: 0; overflow: hidden; opacity: {{ rd.fo }}"><div style="position: absolute; left: -140px; top: 0; width: 420px; height: 600px"><dc-import name="BookPage" form="{{ form }}" on-field="{{ setField }}" on-shelve="{{ shelve }}" page="{{ rd.A }}" side="right" clock="{{ clock }}" hint-size="420px,600px"></dc-import></div><span class="shade" style="opacity: {{ rd.s3a }}"></span></div>
<div class="face" style="inset: 0; transform: rotateY(180deg); overflow: hidden; opacity: {{ rd.fo }}"><div style="position: absolute; left: -210px; top: 0; width: 420px; height: 600px"><dc-import name="BookPage" form="{{ form }}" on-field="{{ setField }}" on-shelve="{{ shelve }}" page="{{ rd.B }}" side="left" clock="{{ clock }}" hint-size="420px,600px"></dc-import></div><span class="shade" style="opacity: {{ rd.s3b }}"></span></div>
<div style="position: absolute; left: 70px; top: 0; width: 70px; height: 600px; transform-origin: 0 50%; transform: {{ rd.t4 }}; transform-style: preserve-3d">
<div class="face" style="inset: 0; overflow: hidden; opacity: {{ rd.fo }}"><div style="position: absolute; left: -210px; top: 0; width: 420px; height: 600px"><dc-import name="BookPage" form="{{ form }}" on-field="{{ setField }}" on-shelve="{{ shelve }}" page="{{ rd.A }}" side="right" clock="{{ clock }}" hint-size="420px,600px"></dc-import></div><span class="shade" style="opacity: {{ rd.s4a }}"></span></div>
<div class="face" style="inset: 0; transform: rotateY(180deg); overflow: hidden; opacity: {{ rd.fo }}"><div style="position: absolute; left: -140px; top: 0; width: 420px; height: 600px"><dc-import name="BookPage" form="{{ form }}" on-field="{{ setField }}" on-shelve="{{ shelve }}" page="{{ rd.B }}" side="left" clock="{{ clock }}" hint-size="420px,600px"></dc-import></div><span class="shade" style="opacity: {{ rd.s4b }}"></span></div>
<div style="position: absolute; left: 70px; top: 0; width: 70px; height: 600px; transform-origin: 0 50%; transform: {{ rd.t5 }}; transform-style: preserve-3d">
<div class="face" style="inset: 0; overflow: hidden; opacity: {{ rd.fo }}"><div style="position: absolute; left: -280px; top: 0; width: 420px; height: 600px"><dc-import name="BookPage" form="{{ form }}" on-field="{{ setField }}" on-shelve="{{ shelve }}" page="{{ rd.A }}" side="right" clock="{{ clock }}" hint-size="420px,600px"></dc-import></div><span class="shade" style="opacity: {{ rd.s5a }}"></span></div>
<div class="face" style="inset: 0; transform: rotateY(180deg); overflow: hidden; opacity: {{ rd.fo }}"><div style="position: absolute; left: -70px; top: 0; width: 420px; height: 600px"><dc-import name="BookPage" form="{{ form }}" on-field="{{ setField }}" on-shelve="{{ shelve }}" page="{{ rd.B }}" side="left" clock="{{ clock }}" hint-size="420px,600px"></dc-import></div><span class="shade" style="opacity: {{ rd.s5b }}"></span></div>
<div style="position: absolute; left: 70px; top: 0; width: 70px; height: 600px; transform-origin: 0 50%; transform: {{ rd.t6 }}; transform-style: preserve-3d">
<div class="face" style="inset: 0; overflow: hidden; opacity: {{ rd.fo }}"><div style="position: absolute; left: -350px; top: 0; width: 420px; height: 600px"><dc-import name="BookPage" form="{{ form }}" on-field="{{ setField }}" on-shelve="{{ shelve }}" page="{{ rd.A }}" side="right" clock="{{ clock }}" hint-size="420px,600px"></dc-import></div><span class="shade" style="opacity: {{ rd.s6a }}"></span></div>
<div class="face" style="inset: 0; transform: rotateY(180deg); overflow: hidden; opacity: {{ rd.fo }}"><div style="position: absolute; left: 0px; top: 0; width: 420px; height: 600px"><dc-import name="BookPage" form="{{ form }}" on-field="{{ setField }}" on-shelve="{{ shelve }}" page="{{ rd.B }}" side="left" clock="{{ clock }}" hint-size="420px,600px"></dc-import></div><span class="shade" style="opacity: {{ rd.s6b }}"></span></div>
</div></div></div></div></div></div>
</div>
</sc-if>
</div>
</div>
</sc-for>
</div>

<!-- once your volume is back on the shelf -->
<div aria-live="polite" style="position: absolute; left: 96px; width: 330px; top: 250px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; opacity: {{ done.op }}; translate: 0 {{ done.y }}; pointer-events: {{ done.pe }}">
<span style="font-size: 44px; font-weight: 800; letter-spacing: -0.05em; line-height: 1">Shelved.</span>
<span style="font-size: 16.5px; line-height: 1.6; color: #56565E">{{ doneLine }}</span>
<button class="ctl" type="button" onClick="{{ again }}" style="margin-top: 6px; height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #DCDAD3; background: transparent; color: #111114; font-family: inherit; font-size: 14px; cursor: pointer">Write another</button>
</div>

<!-- shelf hit areas: pick a volume -->
<sc-for list="{{ hits }}" as="h" hint-placeholder-count="6">
<button class="hit" onClick="{{ h.open }}" onMouseEnter="{{ h.enter }}" onMouseLeave="{{ h.leave }}" onFocus="{{ h.enter }}" onBlur="{{ h.leave }}" aria-label="{{ h.aria }}" style="left: {{ h.x }}; top: {{ h.y }}; width: {{ h.w }}; height: {{ h.h }}; pointer-events: {{ h.pe }}"></button>
</sc-for>

<!-- reading controls -->
<div style="position: absolute; left: 50%; bottom: 26px; translate: -50% {{ bar.y }}; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255,255,255,0.84); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border: 1px solid #E2E0DA; opacity: {{ bar.op }}; pointer-events: {{ bar.pe }}">
<button class="ctl" onClick="{{ back }}" aria-label="{{ bar.prevLabel }}" style="width: 44px; height: 44px; border-radius: 10px; border: none; background: transparent; color: #111114; font-size: 17px; cursor: pointer; opacity: {{ bar.prevOp }}">←</button>
<span class="mono" aria-live="polite" style="min-width: 260px; text-align: center; font-size: 12.5px; color: #56565E">{{ bar.text }}</span>
<button class="ctl" onClick="{{ fwd }}" aria-label="{{ bar.nextLabel }}" style="height: 44px; min-width: 44px; padding: 0 12px; border-radius: 10px; border: none; background: transparent; color: #111114; font-family: inherit; font-size: 13.5px; cursor: pointer">{{ bar.nextText }}</button>
<span style="width: 1px; height: 22px; background: #D6D4CD; margin: 0 4px"></span>
<button class="ctl" onClick="{{ close }}" style="height: 44px; padding: 0 14px; border-radius: 10px; border: none; background: transparent; color: #111114; font-family: inherit; font-size: 13.5px; cursor: pointer">Back to shelf</button>
</div>

<!-- nav -->
<div style="position: absolute; left: 0; right: 0; top: 0; height: 84px; padding: 0 56px; visibility: {{ navVis }}; display: flex; justify-content: space-between; align-items: center; background: rgba(242,241,237,0.72); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px)">
<a href="WallOSS.dc.html" style="font-size: 16px; font-weight: 600; letter-spacing: -0.02em; color: #111114; text-decoration: none">Aedwon</a>
<div style="display: flex; align-items: center; gap: 36px; font-size: 14px">
<a class="nlink" href="WallOSS.dc.html">Wall</a><a class="nlink" href="WallOSS.dc.html">Index</a>
<span aria-hidden="true" style="width: 1px; height: 16px; background: #D6D4CD"></span>
<button class="nlink" onClick="{{ toShelf }}" aria-current="{{ nav.aboutCur }}" style="border: none; background: none; font-family: inherit; font-size: 14px; cursor: pointer; padding: 0; color: {{ nav.about }}">About</button>
<button class="nlink" onClick="{{ toContact }}" aria-current="{{ nav.contactCur }}" style="border: none; background: none; font-family: inherit; font-size: 14px; cursor: pointer; padding: 0; color: {{ nav.contact }}">Contact</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bare":{"editor":"boolean","default":false},"openReq":{"editor":"text","default":""},"closeReq":{"editor":"text","default":""},"onScrollOut":{"editor":null},"onOpen":{"editor":null},"start":{"editor":"enum","options":["shelf","contact"],"default":"shelf"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.uid = 'bk' + Math.floor(Math.random() * 1e9);
    this.state = { tick: 0 };
    const L = '#EDEDED', D = '#0a0a0c';
    const ph = (o) => ({ kind: 'org', eyebrow: 'TRAINING ARC', org: o, roles: [{ title: '[Role]', dates: '[Start] – [End]', desc: '[What you did and what came of it, in a sentence or two.]' }] });
    // six volumes; each page is one side of a leaf
    this.V = [
      { n: '01', title: 'Aerol', tone: L, ink: D, D: 84, pages: [
        { t: 'Hello', kind: 'text', eyebrow: 'CHAPTER 1', title: 'Hi. I’m Aerol.', titleSize: '50px', body: 'I design and build apps, bots and websites, mostly for communities, events and people studying for something hard.', meta: 'Manila · [open to freelance and full-time work]' },
        { t: 'A photo', kind: 'photo', slot: '[a photo of you]', caption: '[where this was taken]' },
        { kind: 'text', eyebrow: 'CHAPTER 2', title: 'High school', titleSize: '44px', body: '[Where you went, and what you were into back then. The first thing you ever built, if you remember it.]', meta: '[School] · [years]' },
        { kind: 'text', eyebrow: 'CHAPTER 3', title: 'College', titleSize: '44px', body: '[What you studied, and what you ended up doing outside class: the orgs, the events, the first real projects.]', meta: '[University] · [course] · [years]' },
        { t: 'Why “Aedwon”', kind: 'big', eyebrow: 'CHAPTER 4 · ONLINE, I GO BY', big: 'Aedwon', bigSize: '86px', body: 'Online, that’s me. [Where the name comes from, in two sentences.]' }
      ] },
      { n: '02', title: 'How I work', tone: '#26262c', ink: L, D: 68, pages: [
        { t: 'Research first', kind: 'big', eyebrow: 'CHAPTER 1 · RESEARCH FIRST', big: '80%', bigSize: '176px', body: 'of every project is research and planning, before any code.' },
        { t: 'The optimal choice', kind: 'text', eyebrow: 'CHAPTER 2 · OPTIMIZE', title: 'Is this the most optimal choice?', titleSize: '40px', body: 'I obsess over it. Every architecture and every workflow gets the same question before it stays.' },
        { t: 'Daily kit', kind: 'list', eyebrow: 'CHAPTER 3 · DAILY KIT', title: 'What I build with', items: [{ a: 'Claude Code', b: 'agentic coding' }, { a: 'Codex', b: 'agentic coding' }, { a: 'using-superpowers', b: 'skill framework' }, { a: 'Matt Pocock’s skills', b: 'engineering' }, { a: 'Gemini Deep Research', b: 'research' }] }
      ] },
      { n: '03', title: 'Guilds', tone: '#15151a', ink: L, D: 76, pages: [
        { kind: 'guild', eyebrow: 'GAMES & ESPORTS', title: 'Games and esports', cols: 2, orgs: ['MOONTON', 'HoYoverse', 'Dark League Studios', 'UP Oblation Esports'] },
        { kind: 'guild', eyebrow: 'BRANDS', title: 'Brands', cols: 1, orgs: ['OPPO Philippines'] },
        { kind: 'guild', eyebrow: 'GOVERNMENT', title: 'Government', cols: 1, orgs: ['Ilocos Sur Provincial Government'] },
        { kind: 'guild', eyebrow: 'EDUCATION & SCIENCE', title: 'Education and science', cols: 1, orgs: ['PSYSC', '3STUDYANTE'] },
        { kind: 'guild', eyebrow: 'UNIVERSITY', title: 'University', cols: 1, orgs: ['UP Diliman', 'UP Fighting Maroons', 'UP Fair 2024'] }
      ] },
      { n: '04', title: 'Training arc', tone: '#202026', ink: L, D: 96, pages: [
        { kind: 'org', eyebrow: 'TRAINING ARC', org: 'PSYSC', roles: [
          { title: 'Marketing Associate', dates: 'Feb 2024 – Present', desc: 'Secured corporate sponsorships generating over ₱800,000 in funding for a national science competition.' },
          { title: 'Regional Head, Region I/II/NCR', dates: 'May – Sep 2024', desc: 'Directed regional elimination rounds and MathSciAKa workshops, coordinating 30+ volunteers.' },
          { title: 'Science Olympiad Core', dates: 'May – Sep 2024', desc: 'Co-authored 500+ questions and built the scoring model for 4,000+ competitors.' }] },
        ph('MOONTON Games'), ph('UP Fighting Maroons'), ph('UP Oblation Esports'), ph('Dark League Studios'), ph('UP Fair 2024'), ph('miHoYo (HoYoverse)')
      ] },
      { n: '05', title: 'Off the clock', tone: '#18181d', ink: L, D: 64, pages: [
        { t: 'Manhwa', kind: 'read', eyebrow: 'READING · MANHWA' }, { t: 'Manga', kind: 'read', eyebrow: 'READING · MANGA' }, { t: 'Isekai and fantasy anime', kind: 'read', eyebrow: 'WATCHING · ISEKAI & FANTASY' }
      ] },
      { n: '06', title: 'Next volume', tone: L, ink: D, D: 56, contact: true, pages: [
        { kind: 'titleit' }, { kind: 'write' }, { kind: 'contact', quickTitle: 'Or the quick way' }
      ] }
    ];
