<!-- phone app: three screens, the middle one raised -->
<sc-if value="{{ v.isPhone }}" hint-placeholder-val="{{ false }}">
<div style="width: 520px; height: 370px; display: flex; align-items: center; justify-content: center; gap: 18px"><div style="width: 156px; height: 330px; padding: 5px; box-sizing: border-box; border-radius: 28px; background: #050506; border: 1px solid #2e2e35; translate: 0 12px"><div style="position: relative; height: 100%; border-radius: 23px; background: #131317; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 12px; color: #8A8A93; text-align: center">[screen 1]<span style="position: absolute; left: 50%; top: 7px; width: 44px; height: 13px; margin-left: -22px; border-radius: 99px; background: #000"></span></div></div><div style="width: 156px; height: 330px; padding: 5px; box-sizing: border-box; border-radius: 28px; background: #050506; border: 1px solid #2e2e35; translate: 0 -12px"><div style="position: relative; height: 100%; border-radius: 23px; background: #131317; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 12px; color: #8A8A93; text-align: center">[screen 2]<span style="position: absolute; left: 50%; top: 7px; width: 44px; height: 13px; margin-left: -22px; border-radius: 99px; background: #000"></span></div></div><div style="width: 156px; height: 330px; padding: 5px; box-sizing: border-box; border-radius: 28px; background: #050506; border: 1px solid #2e2e35; translate: 0 12px"><div style="position: relative; height: 100%; border-radius: 23px; background: #131317; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 12px; color: #8A8A93; text-align: center">[screen 3]<span style="position: absolute; left: 50%; top: 7px; width: 44px; height: 13px; margin-left: -22px; border-radius: 99px; background: #000"></span></div></div></div>
</sc-if>
<!-- Android TV touchscreen: 16:9, thicker bezel, small stand -->
<sc-if value="{{ v.isTv }}" hint-placeholder-val="{{ false }}">
<div style="width: 520px; height: 330px; display: flex; flex-direction: column; align-items: center"><div style="width: 520px; height: 301px; padding: 10px; box-sizing: border-box; border-radius: 10px; background: #050506; border: 1px solid #2e2e35"><div style="height: 100%; border-radius: 2px; background: #131317; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 12px; color: #8A8A93; text-align: center">[{{ v.name }} screen]</div></div><div style="width: 26px; height: 12px; background: #141418"></div><div style="width: 150px; height: 8px; border-radius: 4px 4px 2px 2px; background: #1c1c21"></div></div>
</sc-if>
<!-- website or web tool: the page, a hairline bar, nothing else -->
<sc-if value="{{ v.isWeb }}" hint-placeholder-val="{{ true }}">
<div style="width: 520px; height: 325px; box-sizing: border-box; border-radius: 12px; overflow: hidden; border: 1px solid #26262c; background: #0f0f12; display: flex; flex-direction: column"><div style="height: 20px; flex-shrink: 0; display: flex; align-items: center; gap: 5px; padding: 0 10px; border-bottom: 1px solid #1c1c22"><span style="width: 6px; height: 6px; border-radius: 99px; background: #2c2c32"></span><span style="width: 6px; height: 6px; border-radius: 99px; background: #2c2c32"></span><span style="width: 6px; height: 6px; border-radius: 99px; background: #2c2c32"></span></div><div style="flex: 1; background: #131317; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 12px; color: #8A8A93; text-align: center; padding: 0 16px">[{{ v.name }} screenshot]</div></div>
</sc-if>
<!-- Discord bot: where it lives -->
<sc-if value="{{ v.isDiscord }}" hint-placeholder-val="{{ false }}">
<div style="width: 520px; height: 325px; box-sizing: border-box; border-radius: 10px; overflow: hidden; border: 1px solid #26262c; display: flex"><div style="width: 48px; background: #0d0d10; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 12px"><span style="width: 30px; height: 30px; border-radius: 10px; background: #2c2c34"></span><span style="width: 30px; height: 30px; border-radius: 99px; background: #1e1e24"></span><span style="width: 30px; height: 30px; border-radius: 99px; background: #1e1e24"></span></div><div style="width: 124px; background: #121215; display: flex; flex-direction: column; gap: 10px; padding: 16px 12px; box-sizing: border-box"><span style="height: 7px; width: 70%; border-radius: 4px; background: #2c2c34"></span><span style="height: 6px; width: 80%; border-radius: 3px; background: #1f1f25"></span><span style="height: 6px; width: 60%; border-radius: 3px; background: #2c2c34"></span><span style="height: 6px; width: 75%; border-radius: 3px; background: #1f1f25"></span><span style="height: 6px; width: 55%; border-radius: 3px; background: #1f1f25"></span></div><div style="flex: 1; background: #17171b; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 12px; color: #8A8A93; text-align: center; padding: 0 16px">[{{ v.name }} in Discord]</div></div>
</sc-if>
<!-- developer tool: a terminal -->
<sc-if value="{{ v.isTerm }}" hint-placeholder-val="{{ false }}">
<div style="width: 520px; height: 300px; box-sizing: border-box; border-radius: 10px; overflow: hidden; border: 1px solid #26262c; background: #08080a; display: flex; flex-direction: column"><div style="height: 24px; flex-shrink: 0; display: flex; align-items: center; gap: 5px; padding: 0 10px; border-bottom: 1px solid #18181c"><span style="width: 6px; height: 6px; border-radius: 99px; background: #2c2c32"></span><span style="width: 6px; height: 6px; border-radius: 99px; background: #2c2c32"></span><span style="width: 6px; height: 6px; border-radius: 99px; background: #2c2c32"></span></div><div style="padding: 18px 20px; font-family: 'Geist Mono', monospace; font-size: 13px; line-height: 1.8; color: #8A8A93"><div><span style="color: #4ade80">$</span> [command]</div><div>[real output from the repo]</div><div><span style="color: #4ade80">$</span> <span style="display: inline-block; width: 8px; height: 15px; vertical-align: -2px; background: #8A8A93"></span></div></div></div>
</sc-if>
<!-- open source: the repository, and what you did there -->
<sc-if value="{{ v.isRepo }}" hint-placeholder-val="{{ false }}">
<div style="width: 520px; height: 260px; box-sizing: border-box; border-radius: 10px; border: 1px solid #26262c; background: #0f0f12; padding: 26px 28px; display: flex; flex-direction: column; gap: 14px">
<span style="display: flex; align-items: center; gap: 10px; font-family: 'Geist Mono', monospace; font-size: 14px; color: #EDEDED"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v15H6a2 2 0 0 0-2 2z"></path><path d="M8 7h6"></path></svg>{{ v.repo }}</span>
<span style="font-size: 15px; line-height: 1.6; color: #A1A1AA">{{ v.desc }}</span>
<span style="margin-top: auto; padding-top: 14px; border-top: 1px solid #1c1c22; font-family: 'Geist Mono', monospace; font-size: 12px; color: #8A8A93">[your PR or contribution]</span>
</div>
</sc-if>
<!-- data system: no screen of its own, so its output -->
<sc-if value="{{ v.isData }}" hint-placeholder-val="{{ false }}">
<div style="width: 520px; height: 300px; box-sizing: border-box; border-radius: 10px; border: 1px solid #26262c; background: #131317; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 12px; color: #8A8A93; text-align: center">[{{ v.name }} results]</div>
</sc-if>
<!-- writing: a sheet of paper -->
<sc-if value="{{ v.isPaper }}" hint-placeholder-val="{{ false }}">
<div style="position: relative; width: 520px; height: 300px; box-sizing: border-box; padding: 34px 36px 30px; border-radius: 3px; background: #ECEBE6; color: #111113; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #61616A">{{ v.date }}</span>
<span style="font-size: 25px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.12">{{ v.name }}</span>
<span style="font-size: 14.5px; line-height: 1.55; color: #3f3f46">{{ v.desc }}</span>
<span style="margin-top: auto; font-size: 13px; color: #61616A">Read · {{ v.mins }}</span>
</div>
</sc-if>
